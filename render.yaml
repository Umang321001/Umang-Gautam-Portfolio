services:
  - type: web
    name: umang-gautam-portfolio
    runtime: node
    plan: starter
    buildCommand: npm install
    startCommand: npm start
    disk:
      name: portfolio-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_FILE
        value: /var/data/app.db
      - key: JWT_SECRET
        generateValue: true
